# This workflow automatically deploys my static website to S3 when push to main

name: Deploy static site to S3 (include versioning)

on:
  push:                                   # Trigger this workflow when code is pushed
    branches: [ main ]                    # Only on the 'main' branch
    paths:
      - './site-content/**'    # Only when the website content folder changes
      - '.github/workflows/deploy-site.yml' # ALSO run when this workflow changes
  workflow_dispatch: {}                     # allow manual runs from Actions tab

jobs:
  deploy:                                 
    runs-on: ubuntu-latest                # Use GitHub-hosted Ubuntu runner (virtual machine)
    permissions:
      id-token: write                     # Needed for OpenID Connect (to assume AWS role)
      contents: read                      # Needed to read the repository contents

    env:
      S3_BUCKET: my-terraform.example.com # S3 bucket name 

    steps:
      # STEP 1 — Checkout the repository files into the runner
      - name: Checkout repository
        uses: actions/checkout@v4         # Downloads the repo so next steps can access it

      # STEP 2 — Authenticate to AWS using OIDC (no static secrets)     
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::586549103923:role/GithubOidcDeployRole  # IAM Role for GitHub
          aws-region: eu-central-1          

      # STEP 3 — Upload the site to a release folder named after the commit SHA
      # This keeps a full copy for each version so i can roll back later.
      - name: Upload to release prefix
        run: |
          aws s3 sync ./site-content s3://$S3_BUCKET/releases/${{ github.sha }}/ --delete

      # STEP 4 — Copy (promote) HTML files from the release folder to the bucket root
      # This makes the latest version live.
      # "no-cache" so browsers don't keep showing old HTML.
      - name: Promote HTML to root (short/no cache)
        run: |
          aws s3 cp s3://$S3_BUCKET/releases/${{ github.sha }}/ s3://$S3_BUCKET/ \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      # STEP 6 — Save a small text file showing which version (commit SHA) is currently live
      # Example content of current.txt: 7d92a2d3e7b1234
      - name: Write current.txt
        run: |
          echo "${{ github.sha }}" > current.txt
          aws s3 cp current.txt s3://$S3_BUCKET/current.txt

      # STEP 7 — Invalidate CloudFront cache 
      # This makes CloudFront fetch the newest version of the files immediately.
      # It prevents users from seeing cached old content.
      - name: Invalidate CloudFront cache 
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}  # CloudFront Distribution ID (from secrets)
        if: env.DIST_ID != ''                                 # Only run if it's set
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"

